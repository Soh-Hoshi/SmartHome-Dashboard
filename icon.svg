<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark slate: #1c1e23 to #0d0f12) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1e23"/>
      <stop offset="100%" stop-color="#0d0f12"/>
    </linearGradient>

    <!-- Nova Accent Blue Gradient (#60A5FA to #1E88E5) -->
    <linearGradient id="novaBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="novaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#2196f3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Card (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Ambient Nova Center Glow -->
  <circle cx="256" cy="265" r="150" fill="#2196f3" opacity="0.14" filter="blur(32px)"/>

  <g filter="url(#novaGlow)">
    <!-- Minimalist Modern Roof -->
    <path d="M 256 122 L 105 230 C 97 236 97 247 105 253 C 113 259 124 259 131 253 L 256 163 L 381 253 C 388 259 399 259 407 253 C 415 247 415 236 407 230 Z" fill="url(#novaBlue)"/>

    <!-- Nova Sparkles (Auto_Awesome geometry matching Nova Assist) -->
    <!-- Main Big Star: centered at (256, 276) -->
    <path d="M 256 190 Q 256 276 342 276 Q 256 276 256 362 Q 256 276 170 276 Q 256 276 256 190 Z" fill="url(#novaBlue)"/>
    
    <!-- Core Brilliant Highlight (White Diamond) -->
    <polygon points="256,246 266,276 256,306 246,276" fill="#ffffff"/>

    <!-- Sub Star 1 (Top Right): centered at (328, 230) -->
    <path d="M 328 200 Q 328 230 358 230 Q 328 230 328 260 Q 328 230 298 230 Q 328 230 328 200 Z" fill="url(#novaBlue)"/>

    <!-- Sub Star 2 (Bottom Right): centered at (325, 338) -->
    <path d="M 325 310 Q 325 338 353 338 Q 325 338 325 366 Q 325 338 297 338 Q 325 338 325 310 Z" fill="url(#novaBlue)"/>
  </g>
</svg>
