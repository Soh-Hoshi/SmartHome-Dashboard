apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.smarthome.nova'
    compileSdk 34

    defaultConfig {
        applicationId "com.smarthome.nova"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            storeFile file("nova_release.keystore")
            storePassword "novasmarthome"
            keyAlias "nova"
            keyPassword "novasmarthome"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
