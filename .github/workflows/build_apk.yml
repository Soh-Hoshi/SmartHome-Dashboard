name: Build Nova Assist APK

on:
  push:
    paths:
      - 'android_bridge/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x android_bridge/gradlew

      - name: Build Debug APK
        run: |
          cd android_bridge
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          cp android_bridge/app/build/outputs/apk/debug/app-debug.apk build_output/NovaAssist.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAssist-APK
          path: build_output/NovaAssist.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: "Nova Assist Android Bridge"
          body: |
            ### 🤖 Nova Assist Android Bridge (最新APK)
            Androidの「デフォルトのデジタルアシスタントアプリ」として設定可能な超軽量ブリッジアプリです。

            **インストール手順**:
            1. 下記の Assets から `NovaAssist.apk` をスマホでダウンロード
            2. インストール後、Androidの **「設定 ➔ アプリ ➔ デフォルトアプリ ➔ デジタルアシスタントアプリ」** で **「Nova Assist」** を選択
            3. 電源ボタン長押しや画面下端スワイプで即座にNovaが音声入力待機状態で起動します！
          files: build_output/NovaAssist.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
