name: Build Nova Assist APK

on:
  push:
    paths:
      - 'android_bridge/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x android_bridge/gradlew

      - name: Build Debug APK
        run: |
          cd android_bridge
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle_build.log 2>&1 || {
            echo "::error::Gradle build failed. Showing last 60 lines of build log:"
            tail -n 60 ../gradle_build.log
            exit 1
          }

      - name: Upload Debug Log on Failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-log
          name: "Build Failure Log"
          body: "Gradle build log attached."
          files: gradle_build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          cp android_bridge/app/build/outputs/apk/debug/app-debug.apk build_output/NovaAssist.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAssist-APK
          path: build_output/NovaAssist.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: "Nova Assist Android Bridge"
          body: |
            ### 🤖 Nova Assist Android Bridge (最新APK v1.3.0)
            Androidの「デフォルトのデジタルアシスタントアプリ」＋「サーバー通知受信」対応の超軽量ブリッジアプリです。

            **新機能 (v1.3.0)**:
            - ✨ **Gemini風オーバーレイUI**: 他のアプリを開いたまま、画面下部にボトムシート型オーバーレイとして即時展開
            - 🎙️ **即時音声認識＆波形パルス**: アシスタント起動と同時にマイク待機、声の音量に合わせたリアルタイム波形アニメーション
            - 🔍 **検索バー型テキスト入力**: 声を出せない場面でも文字入力＆Enter/送信ボタンで即実行
            - ⚡ **ワンタップ・ショートカット**: 「💡 電気を消す」「❄️ エアコン」「🖥️ PC」「🧹 掃除機」をワンタップ実行
            - 📱 **ダッシュボード連携**: 上スワイプまたは「ダッシュボード」ボタンで全画面Webダッシュボードへシームレス移行
            - ↩️ **邪魔にならない自動復帰**: コマンド実行成功時は2秒後に自動クローズ（外側タップや下スワイプでも即終了して元のアプリへ）

            **インストール手順**:
            1. 下記の Assets から `NovaAssist.apk` をスマホでダウンロードしてインストール
            2. 初回起動時に通知とマイクの権限を許可
            3. Androidの **「設定 ➔ アプリ ➔ デフォルトアプリ ➔ デジタルアシスタントアプリ」** で **「Nova Assist」** を選択
            4. 電源ボタン長押しや画面下端スワイプで即座にNovaが音声入力待機状態で起動します！
          files: build_output/NovaAssist.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
