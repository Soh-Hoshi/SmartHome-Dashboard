name: Build Nova Assist APK

on:
  push:
    paths:
      - 'android_bridge/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x android_bridge/gradlew

      - name: Build Debug APK
        run: |
          cd android_bridge
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle_build.log 2>&1 || {
            echo "::error::Gradle build failed. Showing last 60 lines of build log:"
            tail -n 60 ../gradle_build.log
            exit 1
          }

      - name: Upload Debug Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName' android_bridge/app/build.gradle | awk -F '"' '{print $2}')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "App Version: ${VERSION}"

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          cp android_bridge/app/build/outputs/apk/debug/app-debug.apk build_output/NovaAssist.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAssist-APK
          path: build_output/NovaAssist.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.VERSION }}
          name: "Nova Assist v${{ env.VERSION }}"
          body: |
            ### 🤖 Nova Assist Android Bridge (v${{ env.VERSION }})
            Androidの「デフォルトのデジタルアシスタントアプリ」＋「サーバー通知受信」対応の超軽量ブリッジアプリです。

            **主な機能**:
            - ✨ **Gemini風ミニマルフローティングUI**: 余計なシートやボタンを排除し、画面下部に検索カプセルだけが浮遊する極限のミニマル設計
            - ⊞ **フロート式ダッシュボードボタン**: 検索バー上部に小さくフロートするボタンから全画面ダッシュボードへワンタップ移行
            - 🎙️ **即時音声認識＆ステータス表示**: マイクボタンのステータス変化と音声入力
            - ↩️ **自動復帰**: コマンド実行成功時は自動クローズ（外側タップや下フリックでも即終了）

            **インストール手順**:
            1. 下記の Assets から `NovaAssist.apk` をスマホでダウンロードしてインストール
            2. 初回起動時に通知とマイクの権限を許可
            3. Androidの **「設定 ➔ アプリ ➔ デフォルトアプリ ➔ デジタルアシスタントアプリ」** で **「Nova Assist」** を選択
            4. 電源ボタン長押しや画面下端スワイプで即座にNovaが音声入力待機状態で起動します！
          files: build_output/NovaAssist.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
