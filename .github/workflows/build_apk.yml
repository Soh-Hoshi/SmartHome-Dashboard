name: Build Nova Assist APK

on:
  push:
    paths:
      - 'android_bridge/**'
      - '.github/workflows/build_apk.yml'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x android_bridge/gradlew

      - name: Build Release APK
        run: |
          cd android_bridge
          ./gradlew assembleRelease --no-daemon --stacktrace > ../gradle_build.log 2>&1 || {
            echo "::error::Gradle build failed. Showing last 60 lines of build log:"
            tail -n 60 ../gradle_build.log
            exit 1
          }

      - name: Upload Debug Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName' android_bridge/app/build.gradle | awk -F '"' '{print $2}')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "App Version: ${VERSION}"

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          cp android_bridge/app/build/outputs/apk/release/app-release.apk build_output/NovaAssist.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAssist-APK
          path: build_output/NovaAssist.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.VERSION }}
          name: "Nova Assist v${{ env.VERSION }}"
          body_path: RELEASE_NOTES.md
          files: build_output/NovaAssist.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
