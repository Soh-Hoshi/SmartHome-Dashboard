<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>ログイン - スマートホーム</title>
  <link rel="icon" type="image/svg+xml" href="/dashboard/icon.svg">
  <link rel="apple-touch-icon" href="/dashboard/apple-touch-icon.png">

  <!-- Google Fonts: Outfit (英数字) + Noto Sans JP (日本語) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Google Material Symbols Rounded -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#0d0f12',
              surface: '#1c1e23',
              'surface-hover': '#24272e',
              sheet: '#1e2025',
              btn: '#2a2d35',
              'btn-hover': '#333742',
              accent: '#2196f3',
              'accent-hover': '#1e88e5',
            }
          },
          fontFamily: {
            sans: ['"Outfit"', '"Noto Sans JP"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html, body {
      background-color: #0d0f12 !important;
      color: #e2e8f0;
      font-family: "Outfit", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-xs bg-[#131518]/95 backdrop-blur-xl border border-white/[0.08] rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center">

    <!-- Nova アイコン (ダッシュボードと完全一致) -->
    <div class="w-12 h-12 rounded-full bg-white/[0.05] border border-white/[0.06] flex items-center justify-center text-neutral-300 mb-3 select-none">
      <span class="material-symbols-rounded text-2xl text-[#2196f3]">auto_awesome</span>
    </div>

    <h1 class="text-lg font-bold tracking-tight text-white mb-5">SmartHome</h1>

    <!-- エラーメッセージ表示枠 -->
    <div id="error-box" class="hidden w-full mb-3 px-3 py-2 rounded-2xl bg-red-500/10 border border-red-500/25 text-red-400 text-xs flex items-center gap-2">
      <span class="material-symbols-rounded text-base shrink-0">error</span>
      <span id="error-msg">パスワードが正しくありません</span>
    </div>

    <!-- フォーム -->
    <form id="login-form" action="/login" method="POST" class="w-full space-y-3">
      <div class="relative flex items-center bg-[#1c1e23] border border-white/[0.08] focus-within:border-[#2196f3]/70 focus-within:ring-2 focus-within:ring-[#2196f3]/25 rounded-2xl transition-all px-3.5 py-2.5">
        <input
          type="password"
          id="key-input"
          name="key"
          required
          autocomplete="current-password"
          placeholder="パスワード"
          class="flex-1 bg-transparent text-[15px] text-white placeholder-neutral-500 focus:outline-none font-normal pr-1"
        />
        <button
          type="button"
          id="toggle-pwd-btn"
          class="text-neutral-400 hover:text-white p-1 transition-colors flex items-center justify-center shrink-0"
          tabindex="-1"
        >
          <span id="toggle-pwd-icon" class="material-symbols-rounded text-[20px]">visibility</span>
        </button>
      </div>

      <button
        type="submit"
        id="submit-btn"
        class="w-full bg-[#2196f3] hover:bg-[#1e88e5] active:scale-[0.99] text-white font-medium text-sm py-3 rounded-2xl transition-all shadow-[0_4px_16px_rgba(33,150,243,0.3)] flex items-center justify-center gap-2"
      >
        <span id="btn-text">ログイン</span>
        <span id="btn-spinner" class="hidden material-symbols-rounded text-sm animate-spin">progress_activity</span>
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const input = document.getElementById('key-input');
    const errorBox = document.getElementById('error-box');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const toggleIcon = document.getElementById('toggle-pwd-icon');

    // パスワード表示切替
    toggleBtn.addEventListener('click', () => {
      if (input.type === 'password') {
        input.type = 'text';
        toggleIcon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        toggleIcon.textContent = 'visibility';
      }
    });

    // URL クエリに error があれば表示
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
      errorBox.classList.remove('hidden');
      errorMsg.textContent = 'パスワードが正しくありません';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = input.value.trim();
      if (!key) return;

      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = '認証中...';
      btnSpinner.classList.remove('hidden');

      try {
        const basePath = window.location.pathname.startsWith('/dashboard') ? '/dashboard' : '';
        const res = await fetch(`${basePath}/api/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'SmartHome-UI'
          },
          body: JSON.stringify({ key: key })
        });

        const data = await res.json();
        if (res.ok && data.status === 'success') {
          btnText.textContent = 'ログイン完了';
          window.location.href = basePath || '/';
        } else {
          errorBox.classList.remove('hidden');
          errorMsg.textContent = data.message || 'パスワードが正しくありません';
          input.focus();
          submitBtn.disabled = false;
          btnText.textContent = 'ログイン';
          btnSpinner.classList.add('hidden');
        }
      } catch (err) {
        form.submit();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      input.focus();
    });
  </script>
</body>
</html>
