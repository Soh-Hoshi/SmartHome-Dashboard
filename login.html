<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>SmartHome - ログイン</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0d0f12;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-[#16191f] border border-[#262a35] rounded-3xl p-8 shadow-2xl relative overflow-hidden">
    <!-- 背景グロー装飾 -->
    <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10 flex flex-col items-center text-center">
      <!-- アプリアイコン -->
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20 mb-5">
        <span class="material-symbols-outlined text-white text-3xl">home</span>
      </div>

      <h1 class="text-xl font-bold tracking-tight text-white mb-1">SmartHome</h1>
      <p class="text-xs text-slate-400 mb-6">アクセスキーを入力してログインしてください</p>

      <!-- エラーメッセージ表示枠 -->
      <div id="error-box" class="hidden w-full mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs text-left flex items-center gap-2">
        <span class="material-symbols-outlined text-sm shrink-0">error</span>
        <span id="error-msg">アクセスキーが正しくありません</span>
      </div>

      <!-- ログインフォーム -->
      <form id="login-form" action="/login" method="POST" class="w-full space-y-4">
        <div class="relative">
          <input
            type="password"
            id="key-input"
            name="key"
            required
            autocomplete="current-password"
            placeholder="アクセスキー"
            class="w-full bg-[#0d0f12] border border-[#2a2f3d] rounded-2xl px-4 py-3.5 pr-11 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
          />
          <button
            type="button"
            id="toggle-pwd-btn"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 p-1 transition-colors"
            title="パスワードを表示"
          >
            <span id="toggle-pwd-icon" class="material-symbols-outlined text-lg">visibility</span>
          </button>
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium text-sm py-3.5 rounded-2xl transition-all shadow-lg shadow-blue-600/25 active:scale-[0.99] flex items-center justify-center gap-2"
        >
          <span id="btn-text">ログイン</span>
          <span id="btn-spinner" class="hidden material-symbols-outlined text-sm animate-spin">progress_activity</span>
        </button>
      </form>

      <p class="text-[11px] text-slate-500 mt-6">
        認証後はこの端末で長期間自動ログインされます
      </p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const input = document.getElementById('key-input');
    const errorBox = document.getElementById('error-box');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const toggleIcon = document.getElementById('toggle-pwd-icon');

    // パスワード表示トグル
    toggleBtn.addEventListener('click', () => {
      if (input.type === 'password') {
        input.type = 'text';
        toggleIcon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        toggleIcon.textContent = 'visibility';
      }
    });

    // URL クエリに error があれば表示
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
      errorBox.classList.remove('hidden');
      errorMsg.textContent = 'アクセスキーが正しくありません';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = input.value.trim();
      if (!key) return;

      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = '認証中...';
      btnSpinner.classList.remove('hidden');

      try {
        const basePath = window.location.pathname.startsWith('/dashboard') ? '/dashboard' : '';
        const res = await fetch(`${basePath}/api/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'SmartHome-UI'
          },
          body: JSON.stringify({ key: key })
        });

        const data = await res.json();
        if (res.ok && data.status === 'success') {
          btnText.textContent = 'ログイン完了';
          // ダッシュボードトップへ遷移
          window.location.href = basePath || '/';
        } else {
          errorBox.classList.remove('hidden');
          errorMsg.textContent = data.message || 'アクセスキーが正しくありません';
          input.focus();
          submitBtn.disabled = false;
          btnText.textContent = 'ログイン';
          btnSpinner.classList.add('hidden');
        }
      } catch (err) {
        // fetch失敗時は通常のフォーム送信フォールバック
        form.submit();
      }
    });

    // 画面ロード時に自動フォーカス
    window.addEventListener('DOMContentLoaded', () => {
      input.focus();
    });
  </script>
</body>
</html>
